<body>
<div id="root"></div>

<!-- 印刷用エリア（@media printで表示） -->
<div id="print-area"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ━━ 定数 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const STORE = "鯛焼き新世界";
const STORE_KEY = "twc_v4";
const VALIDITY = [
  { label:"当日限り", days:0  },
  { label:"3日間",   days:3  },
  { label:"7日間",   days:7  },
  { label:"14日間",  days:14 },
  { label:"30日間",  days:30 },
  { label:"無期限",  days:-1 },
];

// ━━ ユーティリティ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const mkUUID = () => { try { return crypto.randomUUID(); } catch {}
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&0x3|0x8)).toString(16);});
};
const mkCode = () => String(Date.now()).slice(-6)+String(Math.floor(Math.random()*1e6)).padStart(6,"0");
const calcExp = days => {
  if(days===-1) return "2099-12-31T23:59:59.999Z";
  if(days===0){const d=new Date();d.setHours(23,59,59,999);return d.toISOString();}
  return new Date(Date.now()+days*86400000).toISOString();
};
const fmtDate = iso => {
  if(iso==="2099-12-31T23:59:59.999Z") return "無期限";
  const d=new Date(iso);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
};
const fmtDT = iso => {
  const d=new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
};
const isExpired = iso => iso!=="2099-12-31T23:59:59.999Z" && new Date(iso)<new Date();
const getStatus = c => c.cancelled?"cancelled":c.usedAt?"used":isExpired(c.expiresAt)?"expired":"valid";
const SL = {valid:"有効",used:"使用済",expired:"期限切れ",cancelled:"無効"};
const SC = {valid:["#0a2812","#2ecc71"],used:["#2c1a04","#e67e22"],expired:["#2c0a0a","#e74c3c"],cancelled:["#1c1c1c","#555"]};

// ━━ ストレージ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const loadData = () => { try{const v=localStorage.getItem(STORE_KEY);if(v)return JSON.parse(v);}catch{} return []; };
const saveData = list => { try{localStorage.setItem(STORE_KEY,JSON.stringify(list));}catch{} };

// ━━ QRコンポーネント ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function QR({data, size=160}) {
  const ref = useRef(null);
  useEffect(()=>{
    if(!data) return;
    let cancelled=false;
    const draw=()=>{
      if(cancelled) return;
      if(window.QRCode && ref.current){
        ref.current.innerHTML="";
        try{ new window.QRCode(ref.current,{text:data,width:size,height:size,colorDark:"#000",colorLight:"#fff",correctLevel:window.QRCode.CorrectLevel?.M??0}); }catch(e){console.warn(e);}
      } else setTimeout(draw,80);
    };
    draw();
    return ()=>{cancelled=true;};
  },[data,size]);
  return <div ref={ref} style={{lineHeight:0,display:"inline-block",background:"#fff",borderRadius:4}}/>;
}

// ━━ バーコード ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderBC(ref,code,opts={}){
  if(!code||!ref.current) return;
  const def={format:"CODE128",width:2,height:48,displayValue:false,background:"#1c1610",lineColor:"#e0ccaa",margin:6};
  const draw=()=>{
    if(window.JsBarcode&&ref.current){try{window.JsBarcode(ref.current,code,{...def,...opts});}catch{}}
    else setTimeout(draw,150);
  };
  draw();
}

// ━━ 印刷 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// #print-area に内容を書いてから window.print() する
function triggerPrint(coupon){
  const area = document.getElementById("print-area");
  area.innerHTML = `
    <div class="rm-store">${STORE}</div>
    ${coupon.name?`<div class="rm-cname">${coupon.name}</div>`:""}
    <div class="rm-amount"><span class="rm-yen">¥</span>${Number(coupon.amount).toLocaleString()}<span class="rm-hiki">引き</span></div>
    <div class="rm-sep"></div>
    <div class="rm-lbl">QR コード</div>
    <div id="p-qr" style="display:flex;justify-content:center;margin:4px 0"></div>
    <div class="rm-lbl" style="margin-top:10px">バーコード</div>
    <canvas id="p-bc" style="margin:4px auto;display:block;max-width:100%"></canvas>
    <div class="rm-code">${coupon.code}</div>
    <div class="rm-sep"></div>
    <div class="rm-expiry">有効期限：<strong>${fmtDate(coupon.expiresAt)}</strong></div>
    <div class="rm-note-print">このクーポンはお一人様1回限りご利用いただけます。<br>他のクーポンとの併用はできません。</div>
    <div class="rm-uuid">${coupon.uuid}</div>
  `;
  // QR描画
  try{
    new window.QRCode(document.getElementById("p-qr"),{text:coupon.uuid,width:160,height:160,colorDark:"#000",colorLight:"#fff"});
  }catch{}
  // バーコード描画
  try{
    window.JsBarcode("#p-bc",coupon.code,{format:"CODE128",width:2,height:64,displayValue:false,background:"#fff",lineColor:"#000",margin:4});
  }catch{}
  setTimeout(()=>window.print(),300);
}

// ━━ App ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function App(){
  const [mode,   setMode]   = useState("admin");
  const [coupons,setCoupons]= useState(()=>loadData());
  const [custC,  setCustC]  = useState(null);
  const [printC, setPrintC] = useState(null);

  const persist = useCallback(list=>{setCoupons(list);saveData(list);},[]);

  const createCoupon = useCallback((name,amount,days,memo)=>{
    const c={uuid:mkUUID(),code:mkCode(),name,amount,memo,
      issuedAt:new Date().toISOString(),expiresAt:calcExp(days),usedAt:null,cancelled:false};
    const next=[c,...coupons]; persist(next); return c;
  },[coupons,persist]);

  const cancelCoupon = useCallback(uuid=>persist(coupons.map(c=>c.uuid===uuid?{...c,cancelled:true}:c)),[coupons,persist]);

  const useCoupon = useCallback(uuid=>{
    const updated=coupons.map(c=>c.uuid===uuid&&getStatus(c)==="valid"?{...c,usedAt:new Date().toISOString()}:c);
    persist(updated); return updated.find(c=>c.uuid===uuid);
  },[coupons,persist]);

  if(mode==="customer"&&custC) return <CustomerView coupon={custC} onBack={()=>setMode("admin")}/>;

  return <>
    {printC && <PrintModal coupon={printC} onClose={()=>setPrintC(null)}/>}
    <AdminPanel coupons={coupons} onCreate={createCoupon} onCancel={cancelCoupon} onUse={useCoupon}
      onShowCustomer={c=>{setCustC(c);setMode("customer");}} onPrint={c=>setPrintC(c)}/>
  </>;
}

// ━━ RegisterTab ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function RegisterTab({coupons,onUse}){
  const [scanning,setScanning]=useState(false);
  const [manual,setManual]=useState("");
  const [result,setResult]=useState(null);
  const [applied,setApplied]=useState(false);
  const [err,setErr]=useState("");
  const videoRef=useRef(null);
  const canvasRef=useRef(null);
  const bcRef=useRef(null);
  const streamRef=useRef(null);
  const rafRef=useRef(null);
  const pendingStreamRef=useRef(null);

  // video要素がDOMに出現してから srcObject をセット（iOS Safari対策）
  useEffect(()=>{
    if(!scanning) return;
    const v=videoRef.current;
    const stream=pendingStreamRef.current;
    if(!v||!stream) return;
    pendingStreamRef.current=null;
    v.srcObject=stream;
    const onReady=()=>{ v.play().catch(()=>{}); };
    v.addEventListener("loadedmetadata",onReady,{once:true});
    if(v.readyState>=1) onReady();
  },[scanning]);

  const stopCam=useCallback(()=>{
    streamRef.current?.getTracks().forEach(t=>t.stop());
    streamRef.current=null;
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    rafRef.current=null;
    setScanning(false);
  },[]);

  const startCam=useCallback(async()=>{
    setErr(""); setResult(null); setApplied(false);
    if(!navigator.mediaDevices?.getUserMedia){
      setErr("このブラウザはカメラ非対応です。\nSafari または Chrome をお使いください。\n※ HTTPSまたはlocalhostが必要です。");
      return;
    }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}
      });
      streamRef.current=stream;
      // まず scanning=true でvideo要素をDOMに出現させる
      setScanning(true);
      // video要素がレンダリングされるのを待ってから srcObject をセット
      pendingStreamRef.current=stream;
    }catch(e){
      const msg=e?.name==="NotAllowedError"
        ?"カメラの許可が必要です。\nSafariの設定 → このWebサイトの設定 →\nカメラを「許可」に変更してください。"
        :`カメラを起動できませんでした。\n(${e?.message||String(e)})`;
      setErr(msg);
    }
  },[]);

  useEffect(()=>{
    if(!scanning)return;
    let active=true;
    const tick=()=>{
      if(!active)return;
      const v=videoRef.current,c=canvasRef.current;
      if(!v||!c||v.readyState<2||v.videoWidth===0){rafRef.current=requestAnimationFrame(tick);return;}
      c.width=v.videoWidth;c.height=v.videoHeight;
      const ctx=c.getContext("2d");ctx.drawImage(v,0,0);
      if(!window.jsQR){rafRef.current=requestAnimationFrame(tick);return;}
      const qr=window.jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"dontInvert"});
      if(qr?.data){
        stopCam();
        const coupon=coupons.find(c=>c.uuid===qr.data);
        if(coupon)setResult(coupon);
        else setErr("QRコードを読み取りましたが\n対応するクーポンが見つかりません。");
      } else rafRef.current=requestAnimationFrame(tick);
    };
    rafRef.current=requestAnimationFrame(tick);
    return()=>{active=false;if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[scanning,coupons,stopCam]);

  useEffect(()=>()=>stopCam(),[stopCam]);
  useEffect(()=>{if(result)renderBC(bcRef,result.code,{height:40,displayValue:true,fontSize:12,font:"monospace"});},[result]);

  const lookup=()=>{
    const q=manual.trim();setErr("");setApplied(false);
    if(!q){setErr("UUIDまたはバーコード番号を入力してください。");return;}
    const coupon=coupons.find(c=>c.uuid===q||c.code===q);
    if(!coupon){setErr("該当するクーポンが見つかりません。");return;}
    setResult(coupon);setManual("");
  };
  const apply=()=>{if(!result)return;setResult(onUse(result.uuid));setApplied(true);};
  const reset=()=>{setResult(null);setErr("");setApplied(false);};

  if(result){
    const s=getStatus(result);const [bg,fg]=SC[s];
    const topBg={valid:"#0a2418",used:"#2a1804",expired:"#280a0a",cancelled:"#1a1a1a"}[s];
    return(
      <div className="col gap14">
        <div className="res-card" style={{borderColor:fg+"55"}}>
          <div className="res-top" style={{background:topBg}}>
            {result.name&&<div className="res-cname">{result.name}</div>}
            <div className="res-amt"><span style={{fontSize:22}}>¥</span>{Number(result.amount).toLocaleString()}<span style={{fontSize:18,color:"#aaa"}}>引き</span></div>
          </div>
          <div className="res-body">
            <DR l="ステータス" v={<span className="sbadge lg" style={{background:bg,color:fg}}>{SL[s]}</span>}/>
            <DR l="有効期限"   v={fmtDate(result.expiresAt)} hi={s==="valid"}/>
            <DR l="コード"     v={<span className="mono">{result.code}</span>}/>
            <canvas ref={bcRef} className="bc mt8"/>
            {result.memo&&<div className="memo-box mt8"><div className="memo-ttl">📝 スタッフメモ</div><div className="memo-txt">{result.memo}</div></div>}
            {applied&&<div className="msg-ok">✅ クーポンを適用しました</div>}
            {!applied&&s!=="valid"&&<div className="msg-ng">{s==="used"?"このクーポンはすでに使用済みです":s==="expired"?"このクーポンは期限切れです":"このクーポンは無効化されています"}</div>}
          </div>
        </div>
        <div className="col gap8">
          {s==="valid"&&!applied&&<button className="btn-p apply-btn" onClick={apply}>✅ クーポンを適用する</button>}
          <button className="btn-s" onClick={reset}>← 戻る</button>
        </div>
      </div>
    );
  }
  return(
    <div className="col gap16">
      <div className="cam-area">
        {scanning?(
          <>
            <video ref={videoRef} className="cam-vid" playsInline muted/>
            <canvas ref={canvasRef} style={{display:"none"}}/>
            <div className="scan-ov">
              <div className="scan-frame"><div className="scan-line"/>
                <div className="sc tl"/><div className="sc tr"/><div className="sc bl"/><div className="sc br"/>
              </div>
              <div className="scan-hint">QRコードを枠内に合わせてください</div>
            </div>
            <button className="btn-s stop-btn" style={{width:"auto"}} onClick={stopCam}>■ キャンセル</button>
          </>
        ):(
          <div className="cam-ph">
            <div style={{fontSize:44,opacity:.15}}>📷</div>
            <p style={{color:"#555",fontSize:13,textAlign:"center",lineHeight:1.7}}>QRコードをスキャンして照会</p>
            <button className="btn-p" style={{width:"auto",padding:"10px 24px"}} onClick={startCam}>カメラを起動</button>
          </div>
        )}
      </div>
      <div className="divider"><span>または手動入力</span></div>
      <div className="row gap8">
        <input className="inp" style={{flex:1}} placeholder="UUID またはバーコード番号を入力"
          value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==="Enter"&&lookup()}/>
        <button className="btn-s" style={{width:"auto"}} onClick={lookup}>照会</button>
      </div>
      {err&&<div className="err-box">⚠️ {err}</div>}
    </div>
  );
}

// ━━ CustomerView ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function CustomerView({coupon,onBack}){
  const bcRef=useRef(null);
  useEffect(()=>{
    const draw=()=>{
      if(window.JsBarcode&&bcRef.current){try{window.JsBarcode(bcRef.current,coupon.code,{format:"CODE128",width:3,height:72,displayValue:true,fontSize:14,font:"monospace",background:"#fff",lineColor:"#111",margin:8});}catch{}}
      else setTimeout(draw,150);
    };draw();
  },[coupon]);
  return(
    <div className="cv-root">
      <div className="cv-card">
        <div className="cv-deco"/>
        <div className="cv-store">{STORE}</div>
        {coupon.name&&<div className="cv-cname">{coupon.name}</div>}
        <div className="cv-amt"><span className="cv-yen">¥</span>{Number(coupon.amount).toLocaleString()}<span className="cv-hiki">引き</span></div>
        <hr className="cv-sep"/>
        <div className="cv-lbl">QR コード</div>
        <div className="cv-qr-wrap"><QR data={coupon.uuid} size={200}/></div>
        <div className="cv-lbl" style={{marginTop:12}}>バーコード</div>
        <div className="cv-bc-wrap"><canvas ref={bcRef} style={{maxWidth:"100%"}}/></div>
        <hr className="cv-sep"/>
        <div className="cv-exp">有効期限：<strong>{fmtDate(coupon.expiresAt)}</strong></div>
        <div className="cv-note">スクリーンショットを保存してご利用ください</div>
      </div>
      <button className="cv-back" onClick={onBack}>スタッフ画面に戻る</button>
    </div>
  );
}

function DR({l,v,hi}){
  return <div className="dr"><span className="dr-l">{l}</span><span className={`dr-v${hi?" hi":""}`}>{v}</span></div>;
}

// ━━ Mount ━━
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
