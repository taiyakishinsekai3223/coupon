<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鯛焼き新世界 クーポン v5.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0c08;font-family:'Hiragino Kaku Gothic ProN','YuGothic','Noto Sans JP',sans-serif;color:#ddd0b8;-webkit-text-size-adjust:100%}

/* 印刷 */
@media print{
  @page{margin:0;size:80mm auto}
  body>*{display:none!important}
  #print-area{display:block!important;position:static!important}
}
#print-area{display:none;width:576px;background:#fff;color:#000;padding:12px 8px;font-family:'Hiragino Kaku Gothic ProN',sans-serif;text-align:center}
.p-store{font-size:22px;font-weight:900;letter-spacing:3px;padding-bottom:8px;border-bottom:2px solid #000;margin-bottom:10px}
.p-cname{font-size:13px;color:#555;margin-bottom:4px}
.p-amount{font-size:48px;font-weight:900;margin:8px 0;line-height:1}
.p-yen{font-size:22px;vertical-align:super}
.p-hiki{font-size:18px;color:#444}
.p-sep{border:none;border-top:1px dashed #bbb;margin:10px 0}
.p-lbl{font-size:10px;color:#999;letter-spacing:2px;margin:8px 0 4px}
.p-center{display:flex;justify-content:center;margin:4px 0}
.p-code{font-size:11px;font-family:monospace;color:#666;margin-top:3px}
.p-expiry{font-size:14px;margin:8px 0;font-weight:700}
.p-note{font-size:10px;color:#aaa;margin-top:10px;padding-top:8px;border-top:1px dashed #ddd;line-height:1.8}
.p-uuid{font-size:7px;color:#ccc;margin-top:6px;font-family:monospace;word-break:break-all}

/* レイアウト */
#app{max-width:560px;margin:0 auto;min-height:100vh}
.hidden{display:none!important}

/* ヘッダー */
.hdr{background:#181310;border-bottom:1px solid #2a2018;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:8px;font-size:18px}
.bname{font-size:15px;font-weight:800;color:#c8a96e;letter-spacing:2px}
.nav{display:flex;gap:5px}
.tb{position:relative;background:transparent;border:1.5px solid #2a2018;border-radius:20px;color:#555;padding:5px 12px;font-size:12px;cursor:pointer;-webkit-appearance:none;transition:all .2s}
.tb.on{background:#c8a96e;border-color:#c8a96e;color:#1a1510;font-weight:800}
.badge{position:absolute;top:-5px;right:-5px;background:#e74c3c;color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:8px}

/* ページ */
.page{padding:14px;display:flex;flex-direction:column;gap:14px}

/* フォーム */
.field{display:flex;flex-direction:column;gap:6px}
.flbl{font-size:11px;color:#c8a96e;letter-spacing:.5px}
.req{background:#7a1515;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px}
.inp{background:#181310;border:1.5px solid #2a2018;border-radius:8px;padding:10px 12px;color:#ddd0b8;font-size:14px;outline:none;width:100%;-webkit-appearance:none;font-family:inherit}
.inp:focus{border-color:#c8a96e}
.inp::placeholder{color:#2e2418}
.ta{resize:vertical;min-height:56px;line-height:1.5}
.amt-wrap{display:flex;align-items:stretch}
.yen-pre{background:#181310;border:1.5px solid #2a2018;border-right:none;border-radius:8px 0 0 8px;padding:10px 12px;font-size:20px;font-weight:700;color:#c8a96e;display:flex;align-items:center}
.amt-inp{flex:1;border-radius:0;border-left:none;border-right:none;text-align:right;font-size:22px;font-weight:700;color:#ddd0b8;background:#181310;border:1.5px solid #2a2018;padding:10px 12px;outline:none;-webkit-appearance:none}
.hiki-suf{background:#181310;border:1.5px solid #2a2018;border-left:none;border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;color:#666;display:flex;align-items:center}
.quick-row{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.quick-lbl{font-size:10px;color:#555;white-space:nowrap}
.quick-btn{background:#181310;border:1.5px solid #2a2018;border-radius:16px;padding:4px 12px;color:#888;font-size:12px;cursor:pointer;-webkit-appearance:none;transition:all .15s}
.quick-btn.on{background:#c8a96e22;border-color:#c8a96e;color:#c8a96e;font-weight:700}
.amt-prev{text-align:right;font-size:13px;color:#c8a96e;font-weight:700}
.val-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.val-btn{background:#181310;border:1.5px solid #2a2018;border-radius:8px;padding:9px 4px;color:#555;font-size:11px;cursor:pointer;-webkit-appearance:none;transition:all .15s;text-align:center;line-height:1.3}
.val-btn.on{background:#c8a96e18;border-color:#c8a96e;color:#c8a96e;font-weight:700}

/* ボタン */
.btn-p{background:linear-gradient(135deg,#c8a96e,#b8923a);color:#1a1510;border:none;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;-webkit-appearance:none}
.btn-p:disabled{opacity:.3;cursor:default}
.btn-s{background:transparent;color:#c8a96e;border:1.5px solid #c8a96e44;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;text-align:center;width:100%;-webkit-appearance:none}
.btn-cust{background:#0a2218;color:#2ecc71;border:1.5px solid #2ecc7166;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;-webkit-appearance:none}
.btn-print{background:#0a1828;color:#5ba3e0;border:1.5px solid #5ba3e066;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;-webkit-appearance:none}
.btn-danger{background:#2a0808;color:#e74c3c;border:1.5px solid #e74c3c44;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;width:100%;-webkit-appearance:none}
.btn-danger-ok{background:#e74c3c;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;flex:1;-webkit-appearance:none}
.back-btn{background:none;border:none;color:#c8a96e;font-size:13px;cursor:pointer;padding:0;-webkit-appearance:none}

/* カード */
.gcard{background:#181310;border:1.5px solid #2a2018;border-radius:14px;overflow:hidden}
.gc-head{background:#201a10;padding:16px;text-align:center;border-bottom:1px solid #2a2018}
.gc-tag{font-size:9px;color:#444;letter-spacing:4px;margin-bottom:4px}
.gc-store-lbl{font-size:12px;color:#c8a96e;letter-spacing:3px;margin-bottom:4px}
.gc-cname{font-size:12px;color:#888;margin-bottom:6px}
.gc-amt{font-size:38px;font-weight:900;color:#ddd0b8;line-height:1}
.gc-yen{font-size:20px;vertical-align:super;margin-right:2px;color:#c8a96e}
.gc-hiki{font-size:16px;color:#666;margin-left:2px}
.gc-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.gc-2col{display:flex;gap:12px}
.gc-qr-col{display:flex;flex-direction:column;gap:6px;align-items:center}
.gc-info-col{display:flex;flex-direction:column;flex:1;justify-content:center}
.gc-lbl{font-size:9px;color:#444;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.qr-bg{background:#fff;border-radius:6px;padding:4px;display:inline-block;line-height:0}
.bc{max-width:100%;display:block;border-radius:4px}
.dr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e1a12;gap:8px}
.dr:last-child{border-bottom:none}
.dr-l{font-size:10px;color:#555;white-space:nowrap}
.dr-v{font-size:12px;color:#999;text-align:right}
.dr-v.hi{color:#e74c3c;font-weight:700}
.sbadge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.sbadge.lg{font-size:13px;padding:4px 12px}
.mono{font-family:'Courier New',monospace;font-size:11px}
.brk{word-break:break-all}
.memo-box{background:#0e1a14;border:1px solid #1e3828;border-radius:8px;padding:9px 12px}
.memo-ttl{font-size:9px;color:#5a9a6a;letter-spacing:1px;margin-bottom:4px}
.memo-txt{font-size:12px;color:#8ab898;line-height:1.5;white-space:pre-wrap}

/* 一覧 */
.stat-row{display:flex;gap:6px;flex-wrap:wrap}
.stat-chip{background:#181310;border:1.5px solid #2a2018;border-radius:16px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:11px;color:#555;-webkit-appearance:none}
.stat-chip.on{font-weight:700}
.stat-n{font-size:15px;font-weight:900}
.list{display:flex;flex-direction:column;gap:6px}
.empty{text-align:center;color:#2a2018;padding:32px;font-size:14px}
.list-item{background:#181310;border:1.5px solid #2a2018;border-radius:10px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;width:100%;-webkit-appearance:none}
.li-l{flex:1;overflow:hidden}
.li-name{font-size:13px;font-weight:600;color:#ddd0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:10px;color:#444;margin-top:3px}
.li-memo{color:#5a9a6a}
.li-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.li-date{font-size:10px;color:#3a3020}
.confirm-box{background:#280a0a;border:1.5px solid #e74c3c44;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm-txt{font-size:12px;color:#e74c3c;text-align:center}
.row-btns{display:flex;gap:8px}
.rec-box{background:#181310;border:1px solid #2a2018;border-radius:10px;padding:12px}
.rec-ttl{font-size:10px;color:#c8a96e;margin-bottom:8px;letter-spacing:1px}
.rec-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #201a12;font-size:12px;color:#666}
.rec-row:last-child{border-bottom:none}
.rec-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}

/* カメラ */
.cam-area{background:#080604;border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid #2a2018;aspect-ratio:4/3}
#cam-video{width:100%;height:100%;object-fit:cover;display:block}
.cam-ph{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center;width:100%}
.cam-ph-icon{font-size:44px;opacity:.15}
.cam-ph-txt{color:#555;font-size:13px;line-height:1.7}
.scan-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.scan-frame{position:relative;width:200px;height:200px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);overflow:hidden}
@keyframes scanMove{0%{top:0}100%{top:100%}}
.scan-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c8a96e,transparent);animation:scanMove 1.5s linear infinite}
.sc{position:absolute;width:20px;height:20px;border-color:#c8a96e;border-style:solid}
.sc.tl{top:0;left:0;border-width:3px 0 0 3px}
.sc.tr{top:0;right:0;border-width:3px 3px 0 0}
.sc.bl{bottom:0;left:0;border-width:0 0 3px 3px}
.sc.br{bottom:0;right:0;border-width:0 3px 3px 0}
.scan-hint{color:#c8a96e;font-size:12px;letter-spacing:.5px}
.stop-btn-wrap{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;pointer-events:all}
.divider{display:flex;align-items:center;gap:10px;color:#2a2018;font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#2a2018}
.manual-row{display:flex;gap:8px}
.err-box{background:#280808;color:#e74c3c;padding:10px 14px;border-radius:8px;font-size:12px;white-space:pre-wrap;line-height:1.6}
.res-card{background:#181310;border:1.5px solid;border-radius:14px;overflow:hidden}
.res-top{padding:18px;text-align:center}
.res-cname{font-size:13px;color:#888;margin-bottom:4px}
.res-amt{font-size:44px;font-weight:900;color:#ddd0b8;line-height:1}
.res-body{padding:14px;display:flex;flex-direction:column;gap:4px}
.msg-ok{background:#0a2212;color:#2ecc71;text-align:center;padding:12px;border-radius:8px;font-weight:700;font-size:15px;margin-top:8px}
.msg-ng{background:#28080a;color:#e74c3c;text-align:center;padding:10px;border-radius:8px;font-size:13px;margin-top:8px}

/* 印刷モーダル */
.rm-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.rm-receipt{background:#fff;color:#000;width:400px;max-width:100%;padding:14px 10px;text-align:center;max-height:65vh;overflow-y:auto;border-radius:4px}
.rm-store{font-size:20px;font-weight:900;letter-spacing:3px;padding-bottom:8px;border-bottom:2px solid #000;margin-bottom:10px}
.rm-cname{font-size:13px;color:#555;margin-bottom:4px}
.rm-amount{font-size:44px;font-weight:900;margin:8px 0;line-height:1}
.rm-yen{font-size:20px;vertical-align:super}
.rm-hiki{font-size:16px;color:#444}
.rm-sep{border:none;border-top:1px dashed #bbb;margin:10px 0}
.rm-lbl{font-size:10px;color:#999;letter-spacing:2px;margin:8px 0 4px}
.rm-center{display:flex;justify-content:center;margin:4px 0}
.rm-code{font-size:11px;font-family:monospace;color:#666;margin-top:3px}
.rm-expiry{font-size:14px;margin:8px 0;font-weight:700}
.rm-note-txt{font-size:10px;color:#aaa;margin-top:10px;padding-top:8px;border-top:1px dashed #ddd;line-height:1.8}
.rm-uuid{font-size:7px;color:#ccc;margin-top:6px;font-family:monospace;word-break:break-all}
.rm-actions{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:400px}
.rm-print-btn{background:#c8a96e;color:#1a1510;border:none;border-radius:8px;padding:13px 24px;font-size:15px;font-weight:800;cursor:pointer;width:100%;-webkit-appearance:none}
.rm-close-btn{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;width:100%;-webkit-appearance:none}
.version{font-size:10px;color:#3a3020;letter-spacing:.5px;align-self:center}
.debug-log{background:#0a0a0a;border:1px solid #2a2018;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;color:#5a9a6a;max-height:160px;overflow-y:auto;white-space:pre-wrap;line-height:1.5}
.debug-ttl{font-size:10px;color:#c8a96e;margin-bottom:4px;letter-spacing:1px}

/* お客様画面 */
#customer-view{position:fixed;inset:0;z-index:8000;background:linear-gradient(160deg,#fff8f0,#fdf2e0);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:16px;overflow-y:auto}
.cv-card{background:#fff;border-radius:18px;padding:0 0 20px;box-shadow:0 4px 32px rgba(0,0,0,.1);text-align:center;overflow:hidden;border:1px solid #ede0c8;width:100%;max-width:360px}
.cv-deco{height:6px;background:linear-gradient(90deg,#8B1A1A,#c8713a,#c8a96e,#c8713a,#8B1A1A)}
.cv-store{font-size:22px;font-weight:900;color:#8B1A1A;letter-spacing:4px;padding:16px 20px 4px;font-family:'Hiragino Mincho ProN','YuMincho',sans-serif}
.cv-cname{font-size:13px;color:#999;padding:0 20px;margin-bottom:4px}
.cv-amt{font-size:60px;font-weight:900;color:#1a1a1a;padding:10px 20px;line-height:1}
.cv-yen{font-size:28px;vertical-align:top;margin-top:10px;display:inline-block;color:#555}
.cv-hiki{font-size:20px;color:#555}
.cv-sep{border:none;border-top:1.5px dashed #e8d8c0;margin:14px 20px}
.cv-lbl{font-size:10px;color:#c0a080;letter-spacing:3px;text-transform:uppercase;padding:0 20px;margin-bottom:6px;margin-top:10px}
.cv-qr-wrap{padding:0 20px;display:flex;justify-content:center}
.cv-bc-wrap{padding:0 16px;display:flex;justify-content:center;overflow:hidden}
.cv-exp{font-size:13px;color:#666;padding:4px 20px}
.cv-note{font-size:11px;color:#c0a080;padding:6px 20px 0;line-height:1.6}
.cv-back{background:rgba(0,0,0,.06);color:rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.12);border-radius:20px;padding:8px 20px;font-size:13px;cursor:pointer;-webkit-appearance:none}
</style>
</head>
<body>

<div id="print-area"></div>

<!-- お客様画面 -->
<div id="customer-view" class="hidden">
  <div class="cv-card">
    <div class="cv-deco"></div>
    <div class="cv-store">鯛焼き新世界</div>
    <div id="cv-cname" class="cv-cname hidden"></div>
    <div class="cv-amt"><span class="cv-yen">¥</span><span id="cv-amount"></span><span class="cv-hiki">引き</span></div>
    <hr class="cv-sep">
    <div class="cv-lbl">QR コード</div>
    <div class="cv-qr-wrap"><div id="cv-qr"></div></div>
    <div class="cv-lbl">バーコード</div>
    <div class="cv-bc-wrap"><canvas id="cv-bc"></canvas></div>
    <hr class="cv-sep">
    <div class="cv-exp">有効期限：<strong id="cv-exp"></strong></div>
    <div class="cv-note">スクリーンショットを保存してご利用ください</div>
  </div>
  <button class="cv-back" id="cv-back-btn">スタッフ画面に戻る</button>
</div>

<!-- 印刷モーダル -->
<div id="print-modal" class="rm-overlay hidden">
  <div class="rm-receipt">
    <div class="rm-store">鯛焼き新世界</div>
    <div id="pm-cname" class="rm-cname hidden"></div>
    <div class="rm-amount"><span class="rm-yen">¥</span><span id="pm-amount"></span><span class="rm-hiki">引き</span></div>
    <div class="rm-sep"></div>
    <div class="rm-lbl">QR コード</div>
    <div class="rm-center"><div id="pm-qr"></div></div>
    <div class="rm-lbl">バーコード</div>
    <div class="rm-center"><canvas id="pm-bc"></canvas></div>
    <div class="rm-code" id="pm-code"></div>
    <div class="rm-sep"></div>
    <div class="rm-expiry">有効期限：<strong id="pm-exp"></strong></div>
    <div class="rm-note-txt">このクーポンはお一人様1回限りご利用いただけます。<br>他のクーポンとの併用はできません。</div>
    <div class="rm-uuid" id="pm-uuid"></div>
  </div>
  <div class="rm-actions">
    <button class="rm-print-btn" id="do-print-btn">🖨️ 印刷する</button>
    <button class="rm-close-btn" id="close-print-btn">✕ 閉じる</button>
    <div class="rm-hint">印刷ダイアログで Star MC-Print3 を選択してください</div>
  </div>
</div>

<!-- アプリ本体 -->
<div id="app">
  <header class="hdr">
    <div class="brand"><span>🏮</span><span class="bname">鯛焼き新世界</span></div>
    <nav class="nav">
      <button class="tb on" id="tab-create">発行</button>
      <button class="tb"    id="tab-list">一覧<span id="valid-badge" class="badge hidden"></span></button>
      <button class="tb"    id="tab-register">レジ</button>
    </nav>
    <div class="version">v5.1</div>
  </header>

  <!-- 発行フォーム -->
  <div id="page-create" class="page">
    <div style="font-size:14px;color:#c8a96e;letter-spacing:1.5px;font-weight:700">新規クーポン発行</div>
    <div class="field">
      <label class="flbl">クーポン名（任意）</label>
      <input class="inp" id="f-name" placeholder="例：誕生日特典、ランチ割引…">
    </div>
    <div class="field">
      <label class="flbl">割引金額 <span class="req">必須</span></label>
      <div class="amt-wrap">
        <span class="yen-pre">¥</span>
        <input class="amt-inp" id="f-amount" type="number" min="1" step="1" placeholder="500">
        <span class="hiki-suf">引き</span>
      </div>
      <div class="quick-row">
        <span class="quick-lbl">クイック入力：</span>
        <button class="quick-btn" data-val="220">¥220</button>
        <button class="quick-btn" data-val="500">¥500</button>
        <button class="quick-btn" data-val="1000">¥1000</button>
      </div>
      <div id="amt-prev" class="amt-prev hidden"></div>
    </div>
    <div class="field">
      <label class="flbl">有効期限 <span class="req">必須</span></label>
      <div class="val-grid">
        <button class="val-btn" data-days="0">当日限り</button>
        <button class="val-btn" data-days="3">3日間</button>
        <button class="val-btn" data-days="7">7日間</button>
        <button class="val-btn" data-days="14">14日間</button>
        <button class="val-btn" data-days="30">30日間</button>
        <button class="val-btn" data-days="-1">無期限</button>

    <div class="field">
      <label class="flbl">スタッフメモ（お客様には非表示）</label>

  <!-- 発行結果 -->
  <div id="page-issued" class="page hidden">
    <div id="issued-card"></div>
    <button class="btn-cust"  id="issued-cust-btn">👤 お客様に見せる</button>

    <button class="btn-s"     id="back-to-create-btn">＋ 新しいクーポンを発行する</button>
    <div id="recent-box" class="rec-box hidden">
      <div class="rec-ttl">最近の発行</div>

  <!-- 一覧 -->
  <div id="page-list" class="page hidden">
    <div class="stat-row" id="filter-chips"></div>
    <input class="inp" id="search-inp" placeholder="🔍 クーポン名・コード・UUID・メモで検索">

  </div>

  <!-- 詳細 -->
  <div id="page-detail" class="page hidden">
    <button class="back-btn" id="back-to-list-btn">← 一覧に戻る</button>
    <div id="detail-card"></div>
    <div id="detail-actions"></div>
  </div>

  <!-- レジ -->
  <div id="page-register" class="page hidden">
    <div class="cam-area" id="cam-area">
      <div class="cam-ph" id="cam-ph">
        <div class="cam-ph-icon">📷</div>
        <div class="cam-ph-txt">QRコードをスキャンして照会</div>
        <button class="btn-p" style="width:auto;padding:10px 24px" id="start-cam-btn">カメラを起動</button>
      </div>
      <video id="cam-video" playsinline muted class="hidden"></video>
      <div class="scan-ov hidden" id="scan-ov">
        <div class="scan-frame">
          <div class="scan-line"></div>
          <div class="sc tl"></div><div class="sc tr"></div>
          <div class="sc bl"></div><div class="sc br"></div>
        </div>
        <div class="scan-hint">QRコードを枠内に合わせてください</div>
      </div>
      <div class="stop-btn-wrap hidden" id="stop-btn-wrap">
        <button class="btn-s" style="width:auto;padding:8px 20px" id="stop-cam-btn">■ キャンセル</button>
      </div>
    </div>
    <div class="divider"><span>または手動入力</span></div>
    <div class="manual-row">
      <input class="inp" id="manual-inp" style="flex:1" placeholder="UUID またはバーコード番号を入力">
      <button class="btn-s" style="width:auto" id="manual-lookup-btn">照会</button>
    </div>
    <div id="reg-err" class="err-box hidden"></div>
    <div id="reg-result" class="hidden"></div>
    <!-- デバッグログ（スキャン問題の原因特定用） -->
    <div>
      <div class="debug-ttl">🔍 スキャンログ（問題確認用）</div>
      <div class="debug-log" id="debug-log">待機中…</div>
    </div>
  </div>
</div>

<!-- スキャン用 canvas（非表示） -->
<canvas id="scan-canvas" style="display:none"></canvas>

<script>
(function() {
'use strict';

// ━━ 定数 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var STORE = '鯛焼き新世界';
var STORE_KEY = 'twc_v4';
var UNLIMITED = '2099-12-31T23:59:59.999Z';
var VERSION = 'v5.1';

// ━━ デバッグログ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var debugLines = [];
function dbg(msg) {
  var t = new Date();
  var ts = pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds());
  debugLines.push('['+ts+'] '+msg);
  if (debugLines.length > 30) debugLines.shift();
  var el = $('debug-log');
  if (el) { el.textContent = debugLines.join('\n'); el.scrollTop = el.scrollHeight; }
}

// ━━ 状態 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var coupons = [];
var selectedDays = null;
var currentFilter = 'all';
var currentDetailId = null;
var confirmingCancel = false;
var camStream = null;
var scanRaf = null;
var scanActive = false;
var currentIssuedCoupon = null;
var currentPrintCoupon = null;

// ━━ ストレージ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function loadData() {
  try { var v = localStorage.getItem(STORE_KEY); if (v) return JSON.parse(v); } catch(e) {}
  return [];
}
function saveData() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(coupons)); } catch(e) {}
}

// ━━ ユーティリティ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function mkUUID() {
  try { return crypto.randomUUID(); } catch(e) {}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function mkCode() {
  return String(Date.now()).slice(-6) + String(Math.floor(Math.random() * 1e6)).padStart(6, '0');
}
function calcExp(days) {
  if (days === -1) return UNLIMITED;
  if (days === 0) { var d = new Date(); d.setHours(23,59,59,999); return d.toISOString(); }
  return new Date(Date.now() + days * 86400000).toISOString();
}
function fmtDate(iso) {
  if (iso === UNLIMITED) return '無期限';
  var d = new Date(iso);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function fmtDT(iso) {
  var d = new Date(iso);
  return d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function pad(n) { return String(n).padStart(2,'0'); }
function isExpired(iso) { return iso !== UNLIMITED && new Date(iso) < new Date(); }
function getStatus(c) {
  if (c.cancelled) return 'cancelled';
  if (c.usedAt) return 'used';
  if (isExpired(c.expiresAt)) return 'expired';
  return 'valid';
}
var SL = { valid:'有効', used:'使用済', expired:'期限切れ', cancelled:'無効' };
var SC = {
  valid:     { bg:'#0a2812', fg:'#2ecc71' },
  used:      { bg:'#2c1a04', fg:'#e67e22' },
  expired:   { bg:'#2c0a0a', fg:'#e74c3c' },
  cancelled: { bg:'#1c1c1c', fg:'#555'    },
};
function badgeHtml(s) {
  return '<span class="sbadge" style="background:' + SC[s].bg + ';color:' + SC[s].fg + '">' + SL[s] + '</span>';
}
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function $(id) { return document.getElementById(id); }

// ━━ QR / バーコード ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function drawQR(el, data, size) {
  if (!el || !data) return;
  el.innerHTML = '';
  var attempt = 0;
  function go() {
    if (window.QRCode) {
      el.innerHTML = '';
      try {
        new window.QRCode(el, {
          text: data, width: size, height: size,
          colorDark: '#000000', colorLight: '#ffffff',
          correctLevel: (window.QRCode.CorrectLevel && window.QRCode.CorrectLevel.M) || 0,
        });
      } catch(e) { console.warn('QR error:', e); }
    } else if (attempt++ < 30) {
      setTimeout(go, 100);
    }
  }
  go();
}
function drawBC(canvas, code, opts) {
  if (!canvas || !code) return;
  var def = { format:'CODE128', width:2, height:48, displayValue:false, background:'#1c1610', lineColor:'#e0ccaa', margin:6 };
  var attempt = 0;
  function go() {
    if (window.JsBarcode) {
      try {
        var o = {};
        for (var k in def) o[k] = def[k];
        for (var k in opts) o[k] = opts[k];
        window.JsBarcode(canvas, code, o);
      } catch(e) { console.warn('BC error:', e); }
    } else if (attempt++ < 30) {
      setTimeout(go, 150);
    }
  }
  go();
}

// ━━ タブ切り替え ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var TABS = ['create','list','register'];
function switchTab(name) {
  stopCamera();
  TABS.forEach(function(t) {
    $('tab-' + t).classList.toggle('on', t === name);
    $('page-' + t).classList.toggle('hidden', t !== name);
  });
  $('page-issued').classList.add('hidden');
  $('page-detail').classList.add('hidden');
  if (name === 'create') $('page-create').classList.remove('hidden');
  if (name === 'list')   renderList();
}
$('tab-create').addEventListener('click',   function() { switchTab('create'); });
$('tab-list').addEventListener('click',     function() { switchTab('list'); });
$('tab-register').addEventListener('click', function() { switchTab('register'); });

// ━━ 発行タブ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('f-amount').addEventListener('input', onAmountInput);
function onAmountInput() {
  var v = Number($('f-amount').value);
  var prev = $('amt-prev');
  if (v > 0) { prev.textContent = '¥' + v.toLocaleString() + ' 引き'; prev.classList.remove('hidden'); }
  else        { prev.classList.add('hidden'); }
  document.querySelectorAll('.quick-btn').forEach(function(b) {
    b.classList.toggle('on', Number(b.dataset.val) === v);
  });
  updateCreateBtn();
}
document.querySelectorAll('.quick-btn').forEach(function(b) {
  b.addEventListener('click', function() {
    $('f-amount').value = b.dataset.val;
    onAmountInput();
  });
});
document.querySelectorAll('.val-btn').forEach(function(b) {
  b.addEventListener('click', function() {
    document.querySelectorAll('.val-btn').forEach(function(x) { x.classList.remove('on'); });
    b.classList.add('on');
    selectedDays = Number(b.dataset.days);
    updateCreateBtn();
  });
});
function updateCreateBtn() {
  $('create-btn').disabled = !(Number($('f-amount').value) > 0 && selectedDays !== null);
}
$('create-btn').addEventListener('click', function() {
  var name   = $('f-name').value.trim();
  var amount = Number($('f-amount').value);
  var memo   = $('f-memo').value.trim();
  var c = {
    uuid: mkUUID(), code: mkCode(), name: name, amount: amount, memo: memo,
    issuedAt: new Date().toISOString(), expiresAt: calcExp(selectedDays),
    usedAt: null, cancelled: false,
  };
  coupons.unshift(c);
  saveData();
  updateBadge();
  // リセット
  $('f-name').value = '';
  $('f-amount').value = '';
  $('f-memo').value = '';
  $('amt-prev').classList.add('hidden');
  document.querySelectorAll('.val-btn').forEach(function(b) { b.classList.remove('on'); });
  document.querySelectorAll('.quick-btn').forEach(function(b) { b.classList.remove('on'); });
  selectedDays = null;
  updateCreateBtn();
  showIssued(c);
});
$('back-to-create-btn').addEventListener('click', function() {
  $('page-issued').classList.add('hidden');
  $('page-create').classList.remove('hidden');
});

function showIssued(c) {
  currentIssuedCoupon = c;
  $('page-create').classList.add('hidden');
  $('page-issued').classList.remove('hidden');
  $('issued-card').innerHTML = buildCardHtml(c, 'issued');
  setTimeout(function() {
    drawQR($('issued-qr'), c.uuid, 120);
    drawBC($('issued-bc'), c.code, {});
  }, 30);
  // 最近の発行
  var recent = coupons.slice(0, 3);
  if (recent.length) {
    $('recent-list').innerHTML = recent.map(function(r) {
      var s = getStatus(r);
      return '<div class="rec-row"><span class="rec-name">' + esc(r.name || '¥' + Number(r.amount).toLocaleString() + '引き') + '</span>' + badgeHtml(s) + '</div>';
    }).join('');
    $('recent-box').classList.remove('hidden');
  }
}
$('issued-cust-btn').addEventListener('click',  function() { if (currentIssuedCoupon) showCustomer(currentIssuedCoupon); });
$('issued-print-btn').addEventListener('click', function() { if (currentIssuedCoupon) showPrintModal(currentIssuedCoupon); });

// ━━ カード HTML ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function buildCardHtml(c, prefix) {
  var s = getStatus(c);
  return '<div class="gcard">'
    + '<div class="gc-head">'
      + '<div class="gc-tag">COUPON</div>'
      + '<div class="gc-store-lbl">' + esc(STORE) + '</div>'
      + (c.name ? '<div class="gc-cname">' + esc(c.name) + '</div>' : '')
      + '<div class="gc-amt"><span class="gc-yen">¥</span>' + Number(c.amount).toLocaleString() + '<span class="gc-hiki">引き</span></div>'
      + (prefix === 'detail' ? '<div style="margin-top:6px">' + badgeHtml(s) + '</div>' : '')
    + '</div>'
    + '<div class="gc-body">'
      + '<div class="gc-2col">'
        + '<div class="gc-qr-col"><div class="gc-lbl">QR コード</div><div class="qr-bg"><div id="' + prefix + '-qr"></div></div></div>'
        + '<div class="gc-info-col">'
          + '<div class="dr"><span class="dr-l">有効期限</span><span class="dr-v' + (s === 'valid' ? ' hi' : '') + '">' + fmtDate(c.expiresAt) + '</span></div>'
          + '<div class="dr"><span class="dr-l">発行日時</span><span class="dr-v">' + fmtDT(c.issuedAt) + '</span></div>'
          + (c.usedAt ? '<div class="dr"><span class="dr-l">使用日時</span><span class="dr-v">' + fmtDT(c.usedAt) + '</span></div>' : '')
          + '<div class="dr"><span class="dr-l">コード</span><span class="dr-v mono">' + esc(c.code) + '</span></div>'
        + '</div>'
      + '</div>'
      + (c.memo ? '<div class="memo-box"><div class="memo-ttl">📝 スタッフメモ</div><div class="memo-txt">' + esc(c.memo) + '</div></div>' : '')
      + '<div><div class="gc-lbl">バーコード</div><canvas id="' + prefix + '-bc" class="bc"></canvas></div>'
      + '<div class="mono brk" style="color:#333;font-size:8px;margin-top:4px">' + esc(c.uuid) + '</div>'
    + '</div></div>';
}

// ━━ 一覧タブ ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('search-inp').addEventListener('input', renderList);
function updateBadge() {
  var n = coupons.filter(function(c) { return getStatus(c) === 'valid'; }).length;
  var b = $('valid-badge');
  if (n > 0) { b.textContent = n; b.classList.remove('hidden'); }
  else        { b.classList.add('hidden'); }
}
function renderFilterChips() {
  var counts = { all: coupons.length,
    valid:     coupons.filter(function(c){return getStatus(c)==='valid';}).length,
    used:      coupons.filter(function(c){return getStatus(c)==='used';}).length,
    expired:   coupons.filter(function(c){return getStatus(c)==='expired';}).length,
    cancelled: coupons.filter(function(c){return getStatus(c)==='cancelled';}).length,
  };
  var defs = [['all','全て','#888'],['valid','有効','#2ecc71'],['used','使用済','#e67e22'],['expired','期限切れ','#e74c3c'],['cancelled','無効','#555']];
  $('filter-chips').innerHTML = defs.map(function(d) {
    var k=d[0],l=d[1],clr=d[2];
    var on = currentFilter === k;
    return '<button class="stat-chip' + (on?' on':'') + '" style="' + (on?'border-color:'+clr+';color:'+clr:'') + '" data-filter="' + k + '">'
      + '<span class="stat-n" style="color:' + clr + '">' + counts[k] + '</span><span>' + l + '</span></button>';
  }).join('');
  document.querySelectorAll('#filter-chips .stat-chip').forEach(function(b) {
    b.addEventListener('click', function() { currentFilter = b.dataset.filter; renderList(); });
  });
}
function renderList() {
  renderFilterChips();
  var q = ($('search-inp').value || '').toLowerCase();
  var filtered = coupons.filter(function(c) {
    if (currentFilter !== 'all' && getStatus(c) !== currentFilter) return false;
    if (q) return c.uuid.toLowerCase().indexOf(q) >= 0 || c.code.toLowerCase().indexOf(q) >= 0
               || (c.name||'').toLowerCase().indexOf(q) >= 0 || (c.memo||'').toLowerCase().indexOf(q) >= 0;
    return true;
  });
  var el = $('coupon-list');
  if (!filtered.length) { el.innerHTML = '<div class="empty">該当するクーポンがありません</div>'; return; }
  el.innerHTML = filtered.map(function(c) {
    var s = getStatus(c);
    var memo = c.memo ? '<span class="li-memo"> 📝' + esc(c.memo.slice(0,12)) + (c.memo.length>12?'…':'') + '</span>' : '';
    return '<button class="list-item" data-uuid="' + c.uuid + '">'
      + '<div class="li-l">'
        + '<div class="li-name">' + esc(c.name || '¥' + Number(c.amount).toLocaleString() + '引きクーポン') + '</div>'
        + '<div class="li-sub">¥' + Number(c.amount).toLocaleString() + '引き　' + fmtDate(c.issuedAt) + '発行' + memo + '</div>'
      + '</div>'
      + '<div class="li-r">' + badgeHtml(s) + '<div class="li-date">期限 ' + fmtDate(c.expiresAt) + '</div></div>'
    + '</button>';
  }).join('');
  document.querySelectorAll('#coupon-list .list-item').forEach(function(b) {
    b.addEventListener('click', function() { showDetail(b.dataset.uuid); });
  });
}

// ━━ 詳細 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('back-to-list-btn').addEventListener('click', backToList);
function showDetail(uuid) {
  currentDetailId = uuid;
  confirmingCancel = false;
  var c = coupons.filter(function(x){return x.uuid===uuid;})[0];
  if (!c) return;
  $('page-list').classList.add('hidden');
  $('search-inp').value = '';
  $('page-detail').classList.remove('hidden');
  $('detail-card').innerHTML = buildCardHtml(c, 'detail');
  setTimeout(function() {
    drawQR($('detail-qr'), c.uuid, 110);
    drawBC($('detail-bc'), c.code, { height:40 });
  }, 30);
  renderDetailActions(c);
}
function renderDetailActions(c) {
  var s = getStatus(c);
  var el = $('detail-actions');
  if (s !== 'valid') { el.innerHTML = ''; return; }
  if (confirmingCancel) {
    el.innerHTML = '<div class="confirm-box">'
      + '<div class="confirm-txt">⚠️ 無効化すると元に戻せません。</div>'
      + '<div class="row-btns">'
        + '<button class="btn-danger-ok" id="do-cancel-btn">無効化する</button>'
        + '<button class="btn-s" style="flex:1" id="cancel-confirm-btn">キャンセル</button>'
      + '</div></div>';
    $('do-cancel-btn').addEventListener('click', function() {
      coupons = coupons.map(function(x){ return x.uuid===currentDetailId ? Object.assign({},x,{cancelled:true}) : x; });
      saveData(); updateBadge(); backToList();
    });
    $('cancel-confirm-btn').addEventListener('click', function() {
      confirmingCancel = false;
      renderDetailActions(coupons.filter(function(x){return x.uuid===currentDetailId;})[0]);
    });
  } else {
    el.innerHTML = '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">'
      + '<button class="btn-cust"  id="det-cust-btn">👤 お客様に見せる</button>'
      + '<button class="btn-print" id="det-print-btn">🖨️ レシートを印刷する</button>'
      + '<button class="btn-danger" id="det-cancel-btn">🚫 このクーポンを無効化する</button>'
    + '</div>';
    $('det-cust-btn').addEventListener('click',   function() { var c=coupons.filter(function(x){return x.uuid===currentDetailId;})[0]; if(c) showCustomer(c); });
    $('det-print-btn').addEventListener('click',  function() { var c=coupons.filter(function(x){return x.uuid===currentDetailId;})[0]; if(c) showPrintModal(c); });
    $('det-cancel-btn').addEventListener('click', function() { confirmingCancel=true; renderDetailActions(coupons.filter(function(x){return x.uuid===currentDetailId;})[0]); });
  }
}

// ━━ カメラ（バニラJS / iOS Safari 対応） ━━━━━━━━━━━━━━━━━━━━━━━
$('start-cam-btn').addEventListener('click', startCamera);
$('stop-cam-btn').addEventListener('click',  stopCamera);

function startCamera() {
  setRegErr('');
  dbg('カメラ起動開始');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setRegErr('このブラウザはカメラ非対応です。\nSafariをお使いください。\n（HTTPS環境が必要です）');
    dbg('ERROR: getUserMedia 非対応');
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(function(stream) {
    dbg('getUserMedia 成功');
    camStream  = stream;
    scanActive = true;
    var video = $('cam-video');
    video.srcObject = stream;
    video.classList.remove('hidden');
    $('cam-ph').classList.add('hidden');
    $('scan-ov').classList.remove('hidden');
    $('stop-btn-wrap').classList.remove('hidden');

    function doPlay() {
      dbg('play() 呼び出し readyState=' + video.readyState + ' size=' + video.videoWidth + 'x' + video.videoHeight);
      var p = video.play();
      if (p && p.then) {
        p.then(function() {
          dbg('play() 成功 → スキャン開始');
          scanActive = true;
          scanRaf = requestAnimationFrame(scanLoop);
        }).catch(function(e) {
          dbg('play() 失敗: ' + e + ' → 300ms後再試行');
          setTimeout(doPlay, 300);
        });
      } else {
        dbg('play() 同期実行 → スキャン開始');
        scanActive = true;
        scanRaf = requestAnimationFrame(scanLoop);
      }
    }

    dbg('readyState=' + video.readyState);
    if (video.readyState >= 2) {
      doPlay();
    } else {
      dbg('loadedmetadata 待機中…');
      video.addEventListener('loadedmetadata', function() {
        dbg('loadedmetadata 発火');
        doPlay();
      }, { once: true });
      setTimeout(function() {
        if (scanActive && !scanRaf) {
          dbg('タイムアウト → 強制 doPlay');
          doPlay();
        }
      }, 1000);
    }
  }).catch(function(e) {
    dbg('getUserMedia エラー: ' + e.name + ' - ' + e.message);
    var msg = (e.name === 'NotAllowedError')
      ? 'カメラの許可が必要です。\nSafariの設定 → このWebサイトの設定 →\nカメラを「許可」に変更してください。'
      : 'カメラを起動できませんでした。\n(' + (e.message || String(e)) + ')';
    setRegErr(msg);
  });
}

var scanLoopCount = 0;
function scanLoop() {
  if (!scanActive) return;
  var video  = $('cam-video');
  var canvas = $('scan-canvas');
  scanLoopCount++;

  // 5フレームごとにログ
  if (scanLoopCount % 5 === 1) {
    dbg('スキャン中 #' + scanLoopCount
      + ' readyState=' + (video ? video.readyState : 'null')
      + ' size=' + (video ? video.videoWidth+'x'+video.videoHeight : '-')
      + ' paused=' + (video ? video.paused : '-')
      + ' jsQR=' + (window.jsQR ? 'OK' : 'NG'));
  }

  if (!video || video.readyState < 2 || video.videoWidth === 0 || video.paused) {
    scanRaf = requestAnimationFrame(scanLoop);
    return;
  }
  var SCAN = 400;
  var scale = SCAN / Math.max(video.videoWidth, video.videoHeight);
  var w = Math.floor(video.videoWidth  * scale);
  var h = Math.floor(video.videoHeight * scale);
  canvas.width  = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  var imageData = ctx.getImageData(0, 0, w, h);
  var qr = null;
  if (window.jsQR) {
    try { qr = window.jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' }); } catch(e) {
      dbg('jsQR エラー: ' + e);
    }
  }
  if (qr && qr.data) {
    dbg('QR検出! data=' + qr.data.slice(0,20) + '…');
    stopCamera();
    var found = null;
    for (var i = 0; i < coupons.length; i++) {
      if (coupons[i].uuid === qr.data) { found = coupons[i]; break; }
    }
    if (found) {
      dbg('クーポン照合 OK');
      showRegResult(found);
    } else {
      dbg('クーポン照合 NG（DB未登録）');
      setRegErr('QRコードを読み取りましたが\n対応するクーポンが見つかりません。\n(UUID: ' + qr.data.slice(0,16) + '…)');
    }
  } else {
    scanRaf = requestAnimationFrame(scanLoop);
  }
}

function stopCamera() {
  dbg('カメラ停止');
  scanActive = false;
  if (scanRaf) { cancelAnimationFrame(scanRaf); scanRaf = null; }
  if (camStream) { camStream.getTracks().forEach(function(t) { t.stop(); }); camStream = null; }
  var video = $('cam-video');
  if (video) { video.pause(); video.srcObject = null; video.classList.add('hidden'); }
  $('cam-ph').classList.remove('hidden');
  $('scan-ov').classList.add('hidden');
  $('stop-btn-wrap').classList.add('hidden');
}

// ━━ レジ照会 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('manual-lookup-btn').addEventListener('click', lookupManual);
$('manual-inp').addEventListener('keydown', function(e) { if (e.key === 'Enter') lookupManual(); });

function lookupManual() {
  var q = $('manual-inp').value.trim();
  setRegErr('');
  if (!q) { setRegErr('UUIDまたはバーコード番号を入力してください。'); return; }
  var found = null;
  for (var i = 0; i < coupons.length; i++) {
    if (coupons[i].uuid === q || coupons[i].code === q) { found = coupons[i]; break; }
  }
  if (!found) { setRegErr('該当するクーポンが見つかりません。'); return; }
  $('manual-inp').value = '';
  showRegResult(found);
}

function showRegResult(c) {
  var s = getStatus(c);
  var col = SC[s];
  var topBg = { valid:'#0a2418', used:'#2a1804', expired:'#280a0a', cancelled:'#1a1a1a' }[s];
  var applyHtml;
  if (s === 'valid') {
    applyHtml = '<button class="btn-p" style="font-size:17px;padding:16px;margin-top:8px" id="apply-btn">✅ クーポンを適用する</button>';
  } else if (s === 'used') {
    applyHtml = '<div class="msg-ng">このクーポンはすでに使用済みです</div>';
  } else if (s === 'expired') {
    applyHtml = '<div class="msg-ng">このクーポンは期限切れです</div>';
  } else {
    applyHtml = '<div class="msg-ng">このクーポンは無効化されています</div>';
  }
  var el = $('reg-result');
  el.classList.remove('hidden');
  el.innerHTML = '<div class="res-card" style="border-color:' + col.fg + '55">'
    + '<div class="res-top" style="background:' + topBg + '">'
      + (c.name ? '<div class="res-cname">' + esc(c.name) + '</div>' : '')
      + '<div class="res-amt"><span style="font-size:22px">¥</span>' + Number(c.amount).toLocaleString() + '<span style="font-size:18px;color:#aaa">引き</span></div>'
    + '</div>'
    + '<div class="res-body">'
      + '<div class="dr"><span class="dr-l">ステータス</span><span class="dr-v"><span class="sbadge lg" style="background:' + col.bg + ';color:' + col.fg + '">' + SL[s] + '</span></span></div>'
      + '<div class="dr"><span class="dr-l">有効期限</span><span class="dr-v' + (s==='valid'?' hi':'') + '">' + fmtDate(c.expiresAt) + '</span></div>'
      + '<div class="dr"><span class="dr-l">コード</span><span class="dr-v mono">' + esc(c.code) + '</span></div>'
      + (c.memo ? '<div class="memo-box" style="margin-top:8px"><div class="memo-ttl">📝 スタッフメモ</div><div class="memo-txt">' + esc(c.memo) + '</div></div>' : '')
      + applyHtml
    + '</div></div>'
    + '<button class="btn-s" style="margin-top:8px" id="reset-reg-btn">← 戻る</button>';

  if (s === 'valid') {
    $('apply-btn').addEventListener('click', function() {
      coupons = coupons.map(function(x) {
        return x.uuid === c.uuid && getStatus(x) === 'valid'
          ? Object.assign({}, x, { usedAt: new Date().toISOString() }) : x;
      });
      saveData();
      updateBadge();
      $('apply-btn').outerHTML = '<div class="msg-ok">✅ クーポンを適用しました</div>';
    });
  }
  $('reset-reg-btn').addEventListener('click', function() {
    $('reg-result').classList.add('hidden');
    $('reg-result').innerHTML = '';
    setRegErr('');
  });
}

function setRegErr(msg) {
  var el = $('reg-err');
  if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
  else      { el.classList.add('hidden'); }
}

coupons = loadData();
updateBadge();
dbg('起動完了 ' + VERSION + ' / クーポン数=' + coupons.length);
dbg('UA: ' + navigator.userAgent.slice(0,60));

})();
